<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #090a14;
      color: #fff;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-b: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 800;
      font-size: 14px;
      color: #38bdf8;
    }
    .status {
      font-size: 11px;
      color: #4ade80;
      font-weight: 700;
    }
    .stat-card {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .stat-val {
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
    }
    .stat-lbl {
      font-size: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">ShieldBlock AI</div>
    <div class="status">● Active</div>
  </div>
  <div class="stat-card">
    <div class="stat-val" id="count">14,892</div>
    <div class="stat-lbl">Ads & Trackers Blocked Today</div>
  </div>
  <div class="stat-card">
    <div class="stat-val">1.8 GB</div>
    <div class="stat-lbl">Data Bandwidth Saved</div>
  </div>
</body>
</html>
