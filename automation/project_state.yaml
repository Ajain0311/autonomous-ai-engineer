project:
  name: ai-coding-assistant
  description: The AI Coding Assistant is a SaaS application designed to help professional
    developers and coding teams streamline their workflow, improve code quality, and
    enhance collaboration. It utilizes AI-powered tools to analyze code, provide real-time
    feedback, and offer suggestions for improvement.
  vision: To become the leading AI-powered coding assistant for professional developers
    and teams, providing a comprehensive platform for code analysis, feedback, and
    collaboration.
  status: selected
  repository_url: ''
  deployment_url: ''
  created_at: '2026-08-07T05:13:57.515563+00:00'
  updated_at: '2026-08-07T10:43:57.515563'
  title: AI Coding Assistant
architecture:
  notes: The application will feature a React Vite frontend, Node.js Express backend,
    and utilize Zustand for state management and Tailwind for styling. The database
    will consist of JSON files stored in a GitHub repository, with the backend reading,
    writing, and committing changes to the repository.
  db_schema:
    users:
    - id: string
      username: string
      email: string
      password: string
    projects:
    - id: string
      name: string
      description: string
      userId: string
    codeAnalysis:
    - id: string
      projectId: string
      code: string
      analysis: string
  folder_structure:
    frontend: src/
    backend: server/
    database: db/
    config: config/
  auth_design:
    type: JSON Web Token (JWT)
    tokenExpiration: 1 hour
    userStorage: users.json
  api_contracts:
    login:
      method: POST
      route: /api/login
      requestBody:
        username: string
        password: string
      responseBody:
        token: string
    createProject:
      method: POST
      route: /api/projects
      requestBody:
        name: string
        description: string
      responseBody:
        projectId: string
