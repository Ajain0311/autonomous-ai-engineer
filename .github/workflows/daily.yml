name: Daily Code Generator

on:
  schedule:
    # 17:47 UTC = 23:17 IST — deliberately far from daily-automation.yml's
    # slots so the two workflows never compete for the same Gemini quota window.
    - cron: '47 17 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Gemini SDK
        run: pip install google-genai

      - name: Generate and write code
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name "Aditya Jain"
          git config user.email "adityajain8875389629@gmail.com"
          git add .
          git diff --staged --quiet || git commit -m "daily: AI-generated code $(date +%Y-%m-%d)"
          git push
