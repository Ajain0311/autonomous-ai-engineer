name: Daily Code Generator

on:
  schedule:
    - cron: '0 6 * * *'   # 11:30 AM IST every day
  workflow_dispatch:        # manual trigger from Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Gemini SDK
        run: pip install google-generativeai

      - name: Generate and write code
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name "Aditya Jain"
          git config user.email "adityajain8875389629@gmail.com"
          git add .
          git diff --staged --quiet || git commit -m "daily: AI-generated code $(date +%Y-%m-%d)"
          git push
