name: Fix API Keys

on:
  workflow_dispatch:

jobs:
  fix:
    name: Remove invalid Gemini API keys
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-genai

      - name: Test keys and remove invalid ones
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python .github/scripts/fix_api_keys.py
