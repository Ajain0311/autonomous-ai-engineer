name: Daily Code Generation

on:
  schedule:
    #  2 runs/day — keeps us well within Gemini free-tier rate limits.
    #  Each run commits 1 task (TASKS_PER_RUN=1) → 2 commits/day baseline.
    #  Use workflow_dispatch with tasks_per_run=2 to get 4 commits on demand.
    #
    #  Run 1: 04:30 UTC = 10:00 IST
    - cron: '30 4 * * *'
    #  Run 2: 13:30 UTC = 19:00 IST
    - cron: '30 13 * * *'

  workflow_dispatch:
    inputs:
      force_new_project:
        description: 'Ignore current project and start a new one'
        required: false
        default: 'false'
        type: boolean
      tasks_per_run:
        description: 'How many tasks to commit this run (default: 1)'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

jobs:
  generate:
    name: Generate & Commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automation
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ vars.GH_USERNAME }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          FORCE_NEW_PROJECT: ${{ inputs.force_new_project || 'false' }}
          TASKS_PER_RUN: ${{ inputs.tasks_per_run || '1' }}
          PYTHONPATH: ${{ github.workspace }}
        run: python automation/orchestrator.py

      - name: Commit updated state
        run: |
          git config user.name  "Daily Code Bot"
          git config user.email "bot@users.noreply.github.com"
          git add automation/state.json automation/logs/ || true
          git diff --staged --quiet || \
            git commit -m "chore(state): sync state $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
