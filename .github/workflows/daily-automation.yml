name: Daily Code Generation

on:
  schedule:
    #  1 run/day — commits 1 task or plans a new project.
    #  Run 1: 04:17 UTC = 09:47 IST
    - cron: '17 4 * * *'

  workflow_dispatch:
    inputs:
      force_new_project:
        description: 'Ignore current project and start a new one'
        required: false
        default: 'false'
        type: boolean
      tasks_per_run:
        description: 'How many tasks to commit this run (default: 1)'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

# Never let two runs race on state.json / git push
concurrency:
  group: daily-code-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate & Commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automation
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          TOGETHER_API_KEYS: ${{ secrets.TOGETHER_API_KEYS }}
          MISTRAL_API_KEYS: ${{ secrets.MISTRAL_API_KEYS }}
          COHERE_API_KEYS: ${{ secrets.COHERE_API_KEYS }}
          SAMBANOVA_API_KEYS: ${{ secrets.SAMBANOVA_API_KEYS }}
          KILO_API_KEYS: ${{ secrets.KILO_API_KEYS }}
          GITHUB_MODELS_KEYS: ${{ secrets.GITHUB_MODELS_KEYS }}
          HUGGINGFACE_API_KEYS: ${{ secrets.HUGGINGFACE_API_KEYS }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ vars.GH_USERNAME }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          FORCE_NEW_PROJECT: ${{ inputs.force_new_project || 'false' }}
          TASKS_PER_RUN: ${{ inputs.tasks_per_run || '1' }}
          PYTHONPATH: ${{ github.workspace }}
        run: python automation/orchestrator.py

      - name: Commit updated state
        # always() — quota learnings (RPD-exhausted keys, 404-cached models)
        # must persist even when the run step fails, or every subsequent run
        # repeats the same doomed API calls.
        if: always()
        run: |
          git config user.name  "Daily Code Bot"
          git config user.email "bot@users.noreply.github.com"
          git add automation/project_state.yaml automation/logs/ || true
          # Commit if there are staged changes; use --allow-empty as last-resort
          # safety net so a completely empty run still leaves a streak-saving commit.
          git diff --staged --quiet && \
            git commit --allow-empty -m "chore(state): heartbeat $(date -u +'%Y-%m-%d %H:%M UTC')" || \
            git commit -m "chore(state): sync state $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Stash any leftover unstaged changes so rebase doesn't choke,
          # then fetch + rebase instead of `pull --rebase` to avoid the
          # "cannot pull with rebase: You have unstaged changes" error.
          git stash --include-untracked || true
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}" || git rebase --abort
          git stash pop || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
