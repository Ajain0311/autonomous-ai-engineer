name: Daily Code Generation

on:
  schedule:
    #  4 runs/day — each run commits 1 task, spread across IST hours.
    #  Odd minutes: GitHub heavily delays :00/:30 crons. Offset from daily.yml
    #  so the two workflows never race for the same per-project Gemini quota.
    #
    #  Run 1: 04:17 UTC = 09:47 IST
    - cron: '17 4 * * *'
    #  Run 2: 08:17 UTC = 13:47 IST
    - cron: '17 8 * * *'
    #  Run 3: 12:17 UTC = 17:47 IST
    - cron: '17 12 * * *'
    #  Run 4: 16:17 UTC = 21:47 IST
    - cron: '17 16 * * *'

  workflow_dispatch:
    inputs:
      force_new_project:
        description: 'Ignore current project and start a new one'
        required: false
        default: 'false'
        type: boolean
      tasks_per_run:
        description: 'How many tasks to commit this run (default: 1)'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

# Never let two runs race on state.json / git push
concurrency:
  group: daily-code-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate & Commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automation
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ vars.GH_USERNAME }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          FORCE_NEW_PROJECT: ${{ inputs.force_new_project || 'false' }}
          TASKS_PER_RUN: ${{ inputs.tasks_per_run || '1' }}
          PYTHONPATH: ${{ github.workspace }}
        run: python automation/orchestrator.py

      - name: Commit updated state
        # always() — quota learnings (RPD-exhausted keys, 404-cached models)
        # must persist even when the run step fails, or every subsequent run
        # repeats the same doomed API calls.
        if: always()
        run: |
          git config user.name  "Daily Code Bot"
          git config user.email "bot@users.noreply.github.com"
          git add automation/state.json automation/logs/ || true
          git diff --staged --quiet || \
            git commit -m "chore(state): sync state $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push
